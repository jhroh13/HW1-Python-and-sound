name: Android ZeroGPU APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stemnote-zerogpu-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: stemnote-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: stemnote-native-debug-keystore-v1
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify bundled transcription model
        run: python3 tools/fetch_model.py
      - name: Test core formats and transcription
        run: bash tests/run.sh
      - name: Build and lint native ARM64 APK
        run: |
          gradle --no-daemon -PstemnoteAbi=arm64-v8a :app:assembleDebug :app:lintDebug
          mkdir -p out/apk
          cp app/build/outputs/apk/debug/app-debug.apk out/apk/Stemnote-ZeroGPU-arm64.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs out/apk/Stemnote-ZeroGPU-arm64.apk
          python3 tests/inspect_apk.py out/apk/Stemnote-ZeroGPU-arm64.apk
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Android real-model and Gradio transport tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: cd "${{ github.workspace }}/stemnote-android" && gradle --no-daemon -PstemnoteAbi=x86_64 :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Stemnote-ZeroGPU-Android-tests
          path: |
            stemnote-android/app/build/reports/androidTests
            stemnote-android/app/build/outputs/androidTest-results
            stemnote-android/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: Stemnote-ZeroGPU-arm64
          path: stemnote-android/out/apk/Stemnote-ZeroGPU-arm64.apk
          retention-days: 14
      - name: Transfer APK ZIP when requested
        if: contains(github.event.head_commit.message, '[transfer-apk]')
        run: |
          python3 - <<'PY'
          import base64, hashlib, pathlib, textwrap, zipfile
          path = pathlib.Path('out/apk/Stemnote-ZeroGPU-arm64.apk')
          with zipfile.ZipFile('out/transfer.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              z.write(path, path.name)
          print('APK_SHA256', hashlib.sha256(path.read_bytes()).hexdigest())
          print('STEMNOTE_ZERO_ZIP_BEGIN')
          print('\n'.join(textwrap.wrap(base64.b64encode(pathlib.Path('out/transfer.zip').read_bytes()).decode(), 120)))
          print('STEMNOTE_ZERO_ZIP_END')
          PY
  separator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: stemnote-android/zerogpu-space
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install matching CPU runtime for validation
        run: |
          pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt gradio==5.49.1
      - name: Test stem archive contract
        run: python -m unittest -v test_audio_io.py
      - name: Actual Demucs and Gradio API smoke test
        env:
          STEMNOTE_DEVICE: cpu
        run: python smoke_test.py
  deploy_midigen:
    needs: [android, separator]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: stemnote-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone existing Midigen Space
        run: git clone --depth 1 https://huggingface.co/spaces/j0ngh0r0h/Midigen "$RUNNER_TEMP/Midigen"
      - name: Check authorized Hugging Face write authentication
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Add the Hugging Face write token as repository Actions secret HF_TOKEN, then rerun this failed deployment job. The remote Space has not been changed."
            exit 1
          fi
      - name: Convert to Gradio and activate ZeroGPU
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install 'huggingface_hub>=0.35,<2' gradio_client
          python tools/deploy_zerogpu.py j0ngh0r0h/Midigen --verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Midigen-original-source
          path: ${{ runner.temp }}/Midigen
          if-no-files-found: warn
